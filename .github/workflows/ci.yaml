name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_command: hcl fmt --check --diff
